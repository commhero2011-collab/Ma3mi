<!doctype html>
<html lang="en" dir="ltr" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5e3c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Medical Laboratory Management System</title>
<style>/* ===== Theme tokens ===== */
:root,[data-theme=green]{--bg:#f3f6f4;--surface:#fff;--surface2:#f7faf8;--text:#17241d;--muted:#5b6b63;--border:#dbe5df;--primary:#0b5e3c;--primary-h:#084a2f;--primary-ink:#fff;--primary-soft:#e5f2ea;--accent:#16a34a;--head-bg:#0b5e3c;--head-ink:#fff;--nav-bg:#fff;--nav-on:#0b5e3c;--nav-on-ink:#fff;--ok:#166534;--ok-soft:#dcfce7;--warn:#92400e;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--info:#1e40af;--info-soft:#dbeafe;--shadow:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.06);--chart:#0b5e3c;--focus:#2563eb}
[data-theme=blue]{--bg:#f3f6fb;--surface2:#f6f9fd;--text:#162033;--muted:#55627a;--border:#d8e1ee;--primary:#1f4e9c;--primary-h:#183f80;--primary-soft:#e5eefb;--accent:#2563eb;--head-bg:#1f4e9c;--nav-on:#1f4e9c;--chart:#1f4e9c}
[data-theme=teal]{--bg:#f1f7f6;--surface2:#f5faf9;--text:#11302c;--muted:#4e6965;--border:#d3e5e2;--primary:#0f766e;--primary-h:#0b5f58;--primary-soft:#dff3f0;--accent:#14b8a6;--head-bg:#0f766e;--nav-on:#0f766e;--chart:#0f766e}
[data-theme=slate]{--bg:#f2f4f7;--surface2:#f7f8fa;--text:#1e293b;--muted:#5b6475;--border:#dde2ea;--primary:#334155;--primary-h:#1e293b;--primary-soft:#e8edf3;--accent:#0ea5e9;--head-bg:#1e293b;--nav-on:#334155;--chart:#334155}
[data-theme=dark]{--bg:#0b1220;--surface:#131c2e;--surface2:#18233a;--text:#e5ecf5;--muted:#9aa8bd;--border:#26334c;--primary:#22c55e;--primary-h:#16a34a;--primary-ink:#06210f;--primary-soft:#123222;--accent:#4ade80;--head-bg:#0f172a;--head-ink:#e5ecf5;--nav-bg:#0f172a;--nav-on:#1d3b2a;--nav-on-ink:#bbf7d0;--ok:#86efac;--ok-soft:#14321f;--warn:#fcd34d;--warn-soft:#3a2d0b;--bad:#fca5a5;--bad-soft:#3d1414;--info:#93c5fd;--info-soft:#132a4a;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--chart:#4ade80;--focus:#60a5fa}
[data-theme=contrast]{--bg:#fff;--surface:#fff;--surface2:#fff;--text:#000;--muted:#222;--border:#000;--primary:#000;--primary-h:#000;--primary-ink:#ffd400;--primary-soft:#fff3a6;--accent:#000;--head-bg:#000;--head-ink:#ffd400;--nav-bg:#fff;--nav-on:#000;--nav-on-ink:#ffd400;--ok:#004d00;--ok-soft:#c8f7c8;--warn:#5c3a00;--warn-soft:#ffe08a;--bad:#8b0000;--bad-soft:#ffc9c9;--info:#00008b;--info-soft:#cfe0ff;--shadow:none;--chart:#000;--focus:#d00}
[data-theme=contrast] .card,[data-theme=contrast] .kpi,[data-theme=contrast] .btn{border-width:2px}
:root{--fs:14px;--pad:14px;--gap:12px;--rad:10px}
[data-font=small]{--fs:13px}[data-font=large]{--fs:16px}
[data-density=compact]{--pad:9px;--gap:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--primary)}code,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:.92em}
.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.2em;flex:none}.ic.bad{fill:var(--bad)}
.muted{color:var(--muted)}.small{font-size:.86em}.red{color:var(--bad)}.amber{color:var(--warn)}.big{font-size:1.15em}
h2{margin:0;font-size:1.45em;display:flex;align-items:center;gap:8px}h3{margin:0 0 10px;font-size:1.08em;display:flex;align-items:center;gap:7px}h4{margin:14px 0 6px;font-size:.95em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.count{display:inline-block;min-width:22px;padding:0 7px;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-size:.72em;font-weight:600;text-align:center}
/* header */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--head-bg);color:var(--head-ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05em;white-space:nowrap}.brand .ic{width:24px;height:24px}
.hlogo{max-height:30px;border-radius:4px;background:#fff;padding:1px}
.gsw{position:relative;flex:1;max-width:520px;display:flex;align-items:center}.gsw>.ic{position:absolute;left:10px;opacity:.6;color:#333}
.gsw input{width:100%;border:0;border-radius:20px;padding:8px 14px 8px 34px;background:rgba(255,255,255,.95);color:#111;font:inherit}
[data-theme=dark] .gsw input{background:#1e293b;color:#e5ecf5}[data-theme=dark] .gsw>.ic{color:#9aa8bd}
.gs{display:none;position:absolute;top:42px;left:0;right:0;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:40}
.gh{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}.gh:hover{background:var(--primary-soft)}.gh small{color:var(--muted)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{background:transparent;border:0;color:inherit;padding:6px;border-radius:8px;cursor:pointer;display:inline-flex}.iconbtn:hover{background:rgba(255,255,255,.15)}.only-m{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;font-size:.78em;background:rgba(255,255,255,.16);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.chip.warn{background:#f59e0b;color:#1f1400}.chip.bad{background:#ef4444;color:#fff}
.umenu{position:relative}.ubtn{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:inherit;cursor:pointer;padding:3px 6px;border-radius:8px;font:inherit}.ubtn:hover{background:rgba(255,255,255,.12)}
.av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:.85em}
.uname{display:flex;flex-direction:column;text-align:left;line-height:1.15;font-size:.9em}.uname small{opacity:.75;font-size:.8em}
.udrop{display:none;position:absolute;right:0;top:44px;min-width:210px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:50}
.umenu.open .udrop{display:block}.udrop button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;padding:9px 10px;border-radius:7px;cursor:pointer;color:inherit;font:inherit;text-align:left}.udrop button:hover{background:var(--primary-soft)}
.banner{display:flex;align-items:center;gap:8px;padding:8px 16px;font-weight:600;font-size:.92em}.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}
/* layout */
.layout{display:flex;min-height:calc(100vh - 52px)}
nav{width:236px;flex:none;background:var(--nav-bg);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:1px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.navh{font-size:.7em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 10px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;color:var(--text);cursor:pointer;font:inherit;font-size:.94em}
.nav:hover{background:var(--primary-soft)}.nav.on{background:var(--nav-on);color:var(--nav-on-ink);font-weight:600}.nav .ic{opacity:.85}
.nb{margin-left:auto;font-style:normal;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:.75em;font-weight:700}
.navfoot{margin-top:auto;font-size:.74em;color:var(--muted);padding:10px;display:flex;gap:6px;align-items:flex-start}
main{flex:1;min-width:0;padding:18px 22px 40px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.pagehead p{margin:2px 0 0}
.pill{background:var(--primary-soft);color:var(--primary);padding:5px 12px;border-radius:16px;font-weight:600;font-size:.88em}
/* cards & grids */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:var(--pad) calc(var(--pad) + 2px);margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--gap);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}.grid2>.card{margin-bottom:14px}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:.88em;color:var(--muted);font-weight:500}.f.wide{grid-column:1/-1}.f small{font-weight:400}
input,select,textarea{font:inherit;font-size:1rem;color:var(--text);background:var(--surface);padding:7px 10px;border:1px solid var(--border);border-radius:8px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}input:disabled{opacity:.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.row.between{justify-content:space-between}.row .grow,.grow{flex:1;min-width:200px}
.filters{align-items:flex-end}.filters .f{min-width:140px;flex:0 1 180px}
.sm-in{width:110px!important}.cmin{min-width:130px}.resin{width:100px}.flt{max-width:280px}
.scan{width:280px;border:2px dashed var(--primary)!important}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}.actions.left{justify-content:flex-start}
/* buttons */
.btn{font:inherit;font-size:.93em;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--primary);background:var(--primary-soft)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}.btn.pri:hover{background:var(--primary-h)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}[data-theme=dark] .btn.danger{color:#1a0505}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{padding:3px 9px;font-size:.84em}.btn.lg{padding:10px 20px;font-size:1em}.btn.wide{width:100%;justify-content:center;padding:10px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;font:inherit;color:var(--text)}.seg button.on{background:var(--primary);color:var(--primary-ink)}.seg.wrap{flex-wrap:wrap;border:0;gap:6px}
.chkpill{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--border);border-radius:16px;padding:3px 10px;color:var(--text)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.9em}
th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-size:.86em;text-transform:uppercase;letter-spacing:.03em}
th.sa::after{content:" ▲";font-size:.75em}th.sd::after{content:" ▼";font-size:.75em}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--surface2)}
[data-density=compact] td{padding:4px 8px}[data-density=compact] th{padding:5px 8px}
td input,td select,td textarea{padding:4px 7px}.acts{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:.86em;color:var(--muted);margin:4px 0 2px}
.empty{padding:14px;text-align:center}
/* badges & flags */
.badge{display:inline-block;padding:2px 9px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:.78em;font-weight:600;white-space:nowrap;color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.fl{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:700;font-size:.8em;white-space:nowrap}
.fl-H,.fl-L{background:var(--warn-soft);color:var(--warn)}.fl-HH,.fl-LL{background:var(--bad);color:#fff}.fl-POS{background:var(--bad-soft);color:var(--bad)}
[data-theme=dark] .fl-HH,[data-theme=dark] .fl-LL{background:#ef4444;color:#fff}
/* notes */
.note{border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--surface2);border:1px solid var(--border);border-left:4px solid var(--info)}
.note.warn{background:var(--warn-soft);border-color:transparent;border-left-color:#f59e0b;color:var(--text)}.note.bad{background:var(--bad-soft);border-color:transparent;border-left-color:var(--bad)}.note.ok{background:var(--ok-soft);border-color:transparent;border-left-color:var(--ok)}
.consent{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:.93em;color:var(--text);font-weight:400}.consent input{margin-top:3px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0 10px;padding:10px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.facts span{display:flex;flex-direction:column;font-size:.92em}.facts b{font-size:.74em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}.facts .hl{color:var(--primary);font-weight:700}
details summary{cursor:pointer;color:var(--primary);font-weight:600;margin:6px 0}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.kpi>.ic{width:30px;height:30px;padding:6px;border-radius:8px;background:var(--primary-soft);color:var(--primary)}
.kpi b{display:block;font-size:1.45em;line-height:1.1}.kpi span{font-size:.82em;color:var(--muted)}
.kpi.red{border-left-color:var(--bad)}.kpi.red>.ic{background:var(--bad-soft);color:var(--bad)}.kpi.red b{color:var(--bad)}.kpi.amber{border-left-color:#f59e0b}.kpi.amber>.ic{background:var(--warn-soft);color:var(--warn)}
.kpi.lnk{cursor:pointer;transition:transform .12s}.kpi.lnk:hover{transform:translateY(-2px)}
.kpis.mini{grid-template-columns:repeat(2,1fr)}
.kpi.stock{display:block}.meter{height:6px;background:var(--surface2);border-radius:3px;margin:6px 0 2px;overflow:hidden;border:1px solid var(--border)}.meter i{display:block;height:100%;background:var(--primary)}.kpi.stock.red .meter i{background:var(--bad)}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);cursor:pointer;font-size:.92em}.alerts li.bad{background:var(--bad-soft)}.alerts li b{min-width:120px}.alerts li .ic{color:var(--warn)}.alerts li.bad .ic{color:var(--bad)}
/* charts */
.chart{width:100%;height:auto;display:block}.chart .bar{fill:var(--chart)}.chart .bar:hover{opacity:.8}.chart .gl{stroke:var(--border);stroke-dasharray:3 3}.chart .ax{stroke:var(--muted)}
.chart .axt{fill:var(--muted);font-size:10px}.chart .axv{fill:var(--text);font-size:10px;font-weight:600}
.chart .lj0{stroke:var(--chart);stroke-width:1.5}.chart .lj2{stroke:#f59e0b;stroke-dasharray:5 3}.chart .lj3{stroke:#ef4444;stroke-dasharray:5 3}.chart .ljl{fill:none;stroke:var(--chart);stroke-width:1.5}
.chart .pk{fill:var(--chart)}.chart .pw{fill:#f59e0b}.chart .pb{fill:#ef4444}
.legend{display:flex;gap:14px;font-size:.8em;color:var(--muted);margin:2px 0 8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.legend .pk{background:var(--chart)}.legend .pw{background:#f59e0b}.legend .pb{background:#ef4444}
.ljh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.spark polyline{stroke:var(--chart);stroke-width:1.6}
/* misc components */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border)}.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font:inherit;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.pick fieldset{border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:3px;min-width:230px;flex:1 1 230px;max-width:340px}
.pick legend{color:var(--primary);font-weight:700;font-size:.85em;padding:0 4px}.pick label{font-size:.92em;display:flex;gap:6px;align-items:baseline;cursor:pointer}.pick small{color:var(--muted);margin-left:auto}
.pk{background:var(--primary-soft);border-radius:8px;padding:6px 12px;display:flex;gap:6px;align-items:center;cursor:pointer}
.astg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px;margin:6px 0}.astg label{display:flex;justify-content:space-between;align-items:center;font-size:.9em;gap:6px}.astg select{width:72px}
.cmsel{margin-top:3px;font-size:.82em;padding:2px 4px;max-width:180px}
.chainstat{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;margin-bottom:8px}.chainstat .ic{width:30px;height:30px}.chainstat div{display:flex;flex-direction:column}.chainstat.ok{background:var(--ok-soft);color:var(--ok)}.chainstat.bad{background:var(--bad-soft);color:var(--bad)}
.dev .devh{display:flex;gap:10px;align-items:center}.dev .devh>div{display:flex;flex-direction:column;flex:1}.dev .devh small{color:var(--muted)}.dev .devh>.ic{width:28px;height:28px;color:var(--primary)}.dev.down{border-left:4px solid var(--bad)}
.plate{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:430px;margin:8px 0}.plate i{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:8px;font-style:normal;font-weight:700}.plate i.sm{background:var(--primary)}.plate i.nc{background:#94a3b8;color:#fff}.plate i.pc{background:#ef4444;color:#fff}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.theme{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font:inherit;color:var(--text)}.theme.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.sw{display:flex;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.15)}.sw i{width:22px;height:22px}
.preview{margin-top:10px}
/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--primary-soft),var(--bg))}
.login{width:100%;max-width:440px;background:var(--surface);padding:28px;border-radius:16px;border:1px solid var(--border);box-shadow:0 10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:12px}
.login h2{font-size:1.2em}.lockbrand{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border)}.lockbrand .ic{width:40px;height:40px;padding:8px;border-radius:12px;background:var(--primary);fill:var(--primary-ink)}.lockbrand div{display:flex;flex-direction:column}.lockbrand b{font-size:1.15em}.lockbrand small{color:var(--muted)}
/* modal & dialogs */
.modal{position:fixed;inset:0;background:rgba(8,15,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:60;overflow:auto;backdrop-filter:blur(2px)}.modal.dlg{z-index:80;align-items:center}
.modal.hidden{display:none}

function addWorkHours(start, hours) {
  const H = DB.settings.hours || {}, [oh, om] = (H.open || '08:00').split(':').map(Number), [ch, cm] = (H.close || '22:00').split(':').map(Number);
  const closed = H.closed || [], hol = new Set(H.holidays || []);
  let t = new Date(start), rem = hours * 60;
  for (let i = 0; i < 800 && rem > 0; i++) {
    const ds = new Date(t.getFullYear(), t.getMonth(), t.getDate(), oh, om), de = new Date(t.getFullYear(), t.getMonth(), t.getDate(), ch, cm);
    if (closed.includes(t.getDay()) || hol.has(ymd(t)) || t >= de) { t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1, oh, om); continue; }
    if (t < ds) t = ds;
    const avail = Math.min(rem, (de - t) / 60000); t = new Date(t.getTime() + avail * 60000); rem -= avail;
  }
  return t.toISOString();
}
function tatDueFor(codes, stat, from) { const h = Math.max(...codes.map(c => T(c).tat)); return stat ? new Date((from ? new Date(from) : new Date()).getTime() + h * 0.5 * 3600000).toISOString() : addWorkHours(from || new Date(), h); }

const qcRequired = t => !!(t && t.active !== false && t.device && !t.calc && !t.sendOut && !t.qcExempt);
function testBlocked(code) {

  if (qcRequired(t)) {
    if (!DB.qcMaterials.some(m => m.test === code)) return 'No QC material defined (Master Data → QC materials)';
    const hrs = DB.settings.qcValidityHours || 24, last = DB.qcRuns.find(r => r.test === code);
    const fresh = last && (hrs >= 24 ? dayOf(last.t) === today() : Date.now() - new Date(last.t) <= hrs * 3600000);
    if (!fresh) return hrs >= 24 ? 'QC not run today' : `QC not run in the last ${hrs} h`;

  }

}

  if (!user.regNo) return 'No Ministry of Health registration number';

function refreshOrderStatus(o) {
  if (o.cancelled) { o.status = 'Cancelled'; return; }
  const it = o.items;
  if (o.delivered) { o.status = o.amended ? 'Delivered (amended)' : 'Delivered'; return; }
  if (it.every(i => i.status === 'med')) { o.status = o.amended ? 'Amended' : 'Medically validated'; return; }
  if (it.some(i => i.status === 'med')) { o.status = 'Partially ready'; return; }
  if (it.some(i => ['entered', 'tech'].includes(i.status))) { o.status = it.filter(i => !T(i.code).calc).every(i => i.status === 'tech') ? 'Technically validated' : 'In analysis'; return; }
  const ss = DB.samples.filter(s => s.orderId === o.id && !s.replaced);
  if (ss.some(s => s.status === 'Rejected')) { o.status = 'Rejected - recollect'; return; }
  if (ss.length && ss.every(s => ['Received in lab', 'Stored'].includes(s.status))) { o.status = 'Received in lab'; return; }
  if (ss.some(s => ['Collected', 'In transit'].includes(s.status))) { o.status = 'Collected'; return; }
  if (o.approvalStatus === 'Pending approval') { o.status = 'Awaiting payer approval'; return; }
  if (due(o) <= 0.001) { o.status = 'Paid'; return; }
  o.status = 'Registered';
}
function ensureSamples(o) {
  const existing = new Set(DB.samples.filter(s => s.orderId === o.id).flatMap(s => s.tests));
  const need = o.items.filter(i => !T(i.code).calc && !existing.has(i.code)); if (!need.length) return;
  let n = DB.samples.filter(s => s.orderId === o.id).length;
  [...new Set(need.map(i => T(i.code).tube))].forEach(tube => { n++; DB.samples.push({ id: /^\d{10}$/.test(o.id) ? o.id + pad(n) : o.id + '-' + n, orderId: o.id, tube, tests: need.filter(i => T(i.code).tube === tube).map(i => i.code), status: 'Awaiting collection', log: [], branch: o.branch }); });
}
function checkReadyForCollection(o) { if (o.approvalStatus === 'Pending approval') return; if (due(o) <= 0.001) ensureSamples(o); refreshOrderStatus(o); }

async function saveRegistration() {

  }

    const g = val('g_nid'); if (/^\d+$/.test(g)) { const r = parseNID(g); if (r.err) return toast('Guardian national ID ' + r.err, 1); if (ageYears(r.dob) < 18) return toast('The guardian must be an adult', 1); }

  }

  if (disc > 0 && !val('r_discr')) return toast('A discount reason is mandatory', 1);

  const other = DB.patients.find(x => x.nid === nid && x.id !== UI.patientId && !x.mergedInto);
  if (UI.patientId && other) return toast('Another patient file already uses this national ID — merge the files from "Patients"', 1);
  const codes = expandTests(pk.tests);
  let p = UI.patientId ? P(UI.patientId) : other;
  if (p) { const recent = DB.orders.filter(o => o.patientId === p.id && !o.cancelled && (Date.now() - new Date(o.created)) < 7 * 86400000).flatMap(o => o.items.map(i => i.code)); const dup = codes.filter(c => recent.includes(c) && !T(c).calc); if (dup.length && !(await uiConfirm('These tests were ordered for the same patient within 7 days: ' + dup.map(c => T(c).name).join(', ') + '. Continue?', { title: 'Possible duplicate order', ok: 'Continue' }))) return; }
  if (!p) { p = { id: uid('PT'), created: nowISO(), consents: {} }; DB.patients.push(p); }
  Object.assign(p, { name, nid, dob, sex: val('r_sex'), phone, address: val('r_addr'), guardian: guardian || p.guardian || null, restricted: false });
  p.consents = { processing: true, processingAt: nowISO(), marketing: chk('c_mkt'), marketingAt: nowISO(), by: ME.name };
  p.consentLog = (p.consentLog || []).concat([{ t: nowISO(), processing: true, marketing: chk('c_mkt'), guardian: !!guardian, by: ME.name }]);
  const payer = PY(val('r_payer'));

  codes.filter(c => !covered.has(c)).forEach(c => gross += priceOf(c, payer && payer.id));
  gross = r2(gross); const net = r2(gross * (1 - disc / 100)); const payerShare = payer ? r2(net * payer.coverage / 100) : 0;
  const stat = val('r_prio').startsWith('Urgent'); const doc = val('r_doc');
  if (doc && !DB.doctors.some(x => x.name === doc)) DB.doctors.push({ id: uid('DR'), name: doc, specialty: '', phone: '', copy: 'Paper via patient', active: true });
  const o = {
    id: nextOrderId(), patientId: p.id, created: nowISO(), by: ME.name, branch: val('r_branch') || ME.branch, doctor: doc, clinical: val('r_clin'),
    payerId: payer ? payer.id : '', card: val('r_card'), approvalNo: val('r_appr'), approvalStatus: payer ? (payer.needsApproval && !val('r_appr') ? 'Pending approval' : 'Approved') : '',

async function cancelOrder(id) {

  const reason = await uiPrompt('Cancel order ' + id, 'Cancellation reason (mandatory)', { ok: 'Cancel order', message: paid > 0.001 ? `A refund of ${money(paid)} will be recorded.` : '' }); if (!reason) return;
  if (paid > 0.001) { const byM = {}; DB.payments.filter(x => x.orderId === id).forEach(x => byM[x.method] = (byM[x.method] || 0) + x.amount); Object.entries(byM).filter(([, a]) => a > 0.001).forEach(([m, a]) => DB.payments.push({ id: uid('RF'), orderId: id, t: nowISO(), method: m, ref: 'Cancellation refund', amount: -r2(a), by: ME.name, kind: DB.settings.eReceiptObligated ? 'E-return receipt' : 'Refund', etaStatus: DB.settings.eReceiptObligated ? 'Pending submission to tax system' : 'Not required', reason })); }

function addCodesToOrder(id, picks) {

  const add = r2(codes.reduce((s, c) => s + priceOf(c, o.payerId), 0));
  o.gross = r2(o.gross + add); o.net = r2(o.gross * (1 - o.discount / 100)); const payer = PY(o.payerId);
  o.payerShare = payer && o.approvalStatus !== 'Denied' ? r2(o.net * payer.coverage / 100) : 0; o.patientShare = r2(o.net - o.payerShare);

}

function westgard(test, l1, l2) {
  const m1 = DB.qcMaterials.find(m => m.test === test && m.level === 'L1'), m2 = DB.qcMaterials.find(m => m.test === test && m.level === 'L2');
  const z1 = (l1 - m1.mean) / m1.sd, z2 = (l2 - m2.mean) / m2.sd; const prev = DB.qcRuns.filter(r => r.test === test && !r.qual && r.z1 != null && r.status === 'Accepted'); const rules = [];
  if (Math.abs(z1) > 3 || Math.abs(z2) > 3) rules.push('1-3s');
  if ((z1 > 2 && z2 > 2) || (z1 < -2 && z2 < -2)) rules.push('2-2s (within run)');
  if (prev[0] && ((z1 > 2 && prev[0].z1 > 2) || (z1 < -2 && prev[0].z1 < -2) || (z2 > 2 && prev[0].z2 > 2) || (z2 < -2 && prev[0].z2 < -2))) rules.push('2-2s (across runs)');

function toCSV(head, rows) { const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return '\ufeff' + [head].concat(rows).map(r => r.map(q).join(',')).join('\r\n'); }
async function csvWarn() { return uiConfirm('CSV files are NOT encrypted and may contain confidential data. Store the file only on protected media inside the laboratory.', { title: 'Unencrypted export', ok: 'Export' }); }
async function exportCSV(kind) {
  if (!(await csvWarn())) return; let head = [], rows = [];
  if (kind === 'patients') { head = ['ID', 'Name', 'National ID', 'DOB', 'Sex', 'Mobile', 'Address', 'Processing consent', 'Marketing consent', 'Restricted']; rows = DB.patients.map(p => [p.id, p.name, p.nid, p.dob, p.sex, p.phone, p.address, p.consents?.processing ? 'Y' : 'N', p.consents?.marketing ? 'Y' : 'N', p.restricted ? 'Y' : 'N']); }
  if (kind === 'orders') { head = ['Order', 'Created', 'Branch', 'Patient', 'Payer', 'Gross', 'Discount%', 'Net', 'Payer share', 'Patient share', 'Paid', 'Status']; rows = DB.orders.map(o => [o.id, o.created, o.branch, P(o.patientId)?.name, PY(o.payerId)?.name || 'Cash', o.gross, o.discount, o.net, o.payerShare, o.patientShare, paidOf(o), o.status]); }
  if (kind === 'results') { head = ['Order', 'Patient', 'Test', 'Result', 'Unit', 'Flag', 'Status', 'Validated by', 'Validated at']; DB.orders.forEach(o => o.items.forEach(i => rows.push([o.id, P(o.patientId)?.name, T(i.code)?.name, i.result, T(i.code)?.unit, i.flag, i.status, i.medBy || '', i.medAt || '']))); }
  if (kind === 'payments') { head = ['Receipt', 'Time', 'Order', 'Method', 'Ref', 'Amount', 'By', 'Type', 'Tax status']; rows = DB.payments.map(p => [p.id, p.t, p.orderId, p.method, p.ref, p.amount, p.by, p.kind, p.etaStatus]); }
  if (kind === 'audit') { head = ['Time', 'User', 'Role', 'Action', 'Details', 'Hash']; rows = DB.audit.map(a => [a.t, a.user, a.role, a.action, a.detail, a.h || '']); }
  if (kind === 'inventory') { head = ['Item', 'Lot', 'Expiry', 'Qty', 'Verified']; rows = DB.lots.map(l => [DB.items.find(i => i.id === l.item)?.name, l.lot, l.expiry, l.qty, l.verified ? 'Y' : 'N']); }
  if (kind === 'qc') { head = ['Time', 'Test', 'L1', 'z1', 'L2', 'z2', 'NEG', 'POS', 'Rules', 'Status', 'Lot', 'By']; rows = DB.qcRuns.map(r => [r.t, r.test, r.l1 ?? '', r.z1 != null ? r.z1.toFixed(2) : '', r.l2 ?? '', r.z2 != null ? r.z2.toFixed(2) : '', r.neg || '', r.pos || '', (r.rules || []).join('; '), r.status, r.lot, r.by]); }
  downloadFile(`lims_${kind}_${today()}.csv`, toCSV(head, rows), 'text/csv'); audit('CSV export', kind); save();
}

async function saveUser(id) {
  const pw = val('us_p'); if (!val('us_n')) return toast('Name is required', 1); if (!id && !pw) return toast('Set an initial password', 1);
  if (pw) { const w = pwWeak(pw); if (w) return toast(w, 1); }
  const specs = [...document.querySelectorAll('.us_s:checked')].map(c => c.value);
  if (val('us_r') === 'doctor' && (!specs.length || !val('us_g'))) return toast('A lab physician needs a registered specialty and registration number', 1);
  if (id && U(id).role === 'admin' && (val('us_r') !== 'admin' || !chk('us_a')) && DB.users.filter(x => x.role === 'admin' && x.active).length < 2) return toast('Cannot remove the last administrator', 1);
  const u = id ? U(id) : { id: uid('U'), prefs: {} };
  Object.assign(u, { name: val('us_n'), role: val('us_r'), regNo: val('us_g'), licenseExp: val('us_e'), specs, fund: chk('us_f'), active: chk('us_a'), branch: val('us_b') || DB.settings.branchDefault });

  u.failCount = 0; u.lockUntil = ''; if (!id) DB.users.push(u);
  closeModal(); commit(id ? 'Edit user' : 'Add user', u.name + (pw ? ' — password set' : ''));
}

function saveCompliance() { Object.assign(DB.settings, { dpoName: val('cs_dpo'), pdpcStatus: val('cs_st'), pdpcDeadline: val('cs_dl') }); commit('Licence status updated', val('cs_st')); }
function addDSR() { if (!val('ds_p')) return; if (!chk('ds_id')) return toast('Requester identity verification is mandatory', 1); DB.dsr.unshift({ id: uid('DSR'), patientId: val('ds_p'), type: val('ds_t'), details: val('ds_d'), created: nowISO(), due: addDays(today(), DB.settings.dsrTargetDays), status: 'Open', channel: 'Desk', identityVerified: true }); commit('Data-rights request recorded'); }
async function execDSR(id) {
  const d = DB.dsr.find(x => x.id === id), p = P(d.patientId);
  if (d.type === 'Erasure') { const hold = DB.orders.some(o => o.patientId === p.id); d.outcome = hold ? 'Processing restricted instead of erasure — legal obligation to retain medical and tax records' : 'Erased'; if (hold) p.restricted = true; else Object.assign(p, { name: 'Erased', phone: '', nid: '', address: '' }); }
  else if (d.type === 'Restriction' || d.type === 'Objection') { p.restricted = true; d.outcome = 'Processing restricted'; }
  else if (d.type === 'Withdraw marketing consent') { p.consents.marketing = false; d.outcome = 'Marketing consent withdrawn'; }
  else if (d.type === 'Access') { if (!(await csvWarn())) return; downloadFile(`data_${p.id}.json`, JSON.stringify({ patient: p, orders: DB.orders.filter(o => o.patientId === p.id) }, null, 1)); d.outcome = 'Copy of data provided'; }
  else { const w = await uiPrompt('Rectification', 'What was rectified?'); if (!w) return; d.outcome = w; }
  d.status = 'Completed'; d.closed = nowISO(); commit('Data-rights request executed', id + ' — ' + d.outcome);
}
function addBreach() { if (!val('br_d')) return toast('Enter the description', 1); DB.breaches.unshift({ id: uid('BR'), discovered: new Date(val('br_t')).toISOString(), desc: val('br_d'), kind: val('br_k'), affected: +val('br_n') || 0, containment: val('br_c'), pdpcNotified: '', patientsNotified: false, rootCause: '', by: ME.name }); commit('Data breach logged'); }
async function breachStep(id, step) { const b = DB.breaches.find(x => x.id === id); if (step === 'pdpc') b.pdpcNotified = nowISO(); if (step === 'pat') b.patientsNotified = true; if (step === 'rc') { const r = await uiPrompt('Root cause', 'Root cause and corrective action'); if (!r) return; b.rootCause = r; } commit('Breach updated', id + ' ' + step); }
function notifSent(id) { const n = DB.notifReports.find(x => x.id === id); n.sent = nowISO(); n.by = ME.name; commit('Disease notification sent', id); }
function addWaste() { DB.waste.unshift({ id: uid('W'), date: val('ws_d'), type: val('ws_t'), weight: val('ws_w'), contractor: val('ws_c'), contractorLicenseExp: val('ws_e'), receipt: val('ws_r') }); commit('Waste recorded'); }
async function anonymize(id) { if (!(await uiConfirm('Permanently anonymise this patient?', { danger: true, ok: 'Anonymise' }))) return; Object.assign(P(id), { name: 'Anonymised', phone: '', nid: '', address: '', guardian: null }); commit('Anonymised after retention period', id); }

/* =====================================================================
   AUDIT LOG — chain status, anchors, yearly archive
   ===================================================================== */
VIEWS.audit = () => {
  const f = UI.af || { from: addDays(today(), -7), to: today(), user: '', q: '' }; UI.af = f; const v = verifyAudit();
  const users = [...new Set(DB.audit.map(a => a.user))];
  const rows = DB.audit.filter(a => { const d = dayOf(a.t); return d >= f.from && d <= f.to && (!f.user || a.user === f.user) && (!f.q || (a.action + ' ' + a.detail).toLowerCase().includes(f.q.toLowerCase())); });
  const oldest = DB.audit.length ? DB.audit[DB.audit.length - 1].t : ''; const lastYear = new Date().getFullYear() - 1;
  return `<div class="pagehead"><h2>${icon('list')} Audit Log</h2></div>
  ${card('Audit-trail integrity', `<div class="chainstat ${v.ok ? 'ok' : 'bad'}">${icon(v.ok ? 'shield' : 'alert')}<div><b>${v.ok ? 'Intact' : 'NOT INTACT'}</b><span>${v.ok ? `${v.chained} chained entries${v.legacy ? ` (+${v.legacy} older entries before v9)` : ''} · chain code <code>${esc(v.head.slice(0, 16))}…</code>` : esc(v.msg)}</span></div></div>
   <div class="actions"><button class="btn" onclick="printAnchor()">${icon('print')} Print today's anchor</button><button class="btn ghost" onclick="exportAuditArchive()">Export full trail</button>${ME.role === 'admin' ? `<button class="btn ghost" onclick="archiveDlg()">${icon('archive')} Archive a past year</button>` : ''}</div>
   <p class="muted small">Entries are never edited or deleted. Each entry is chained to the previous one; any change breaks the chain. Print and sign an anchor every day. Older years can be moved to an encrypted archive file to keep the system fast — the chain continues across archives.</p>
   ${(DB.archives || []).length ? tbl(['Archived', 'Period up to', 'Entries', 'By', 'Last hash'], DB.archives.map(a => [fmtDT(a.t), fmtD(a.to), a.n, esc(a.by), `<code>${esc(a.lastH.slice(0, 12))}…</code>`])) : ''}
   ${(DB.anchors || []).length ? tbl(['Anchor printed', 'Entries', 'Code', 'By'], DB.anchors.map(x => [fmtDT(x.t), x.n, `<code>${esc(x.head.slice(0, 16))}…</code>`, esc(x.by)]), { key: 'anc', size: 5 }) : ''}`)}
  ${card('', `<div class="row filters">${field('From', inp('af_f', f.from, 'date'))}${field('To', inp('af_t', f.to, 'date'))}${field('User', sel('af_u', [['', 'All']].concat(users), f.user))}${field('Search', inp('af_q', f.q, 'search'))}<button class="btn" onclick="UI.af={from:val('af_f'),to:val('af_t'),user:val('af_u'),q:val('af_q')};UI.pg={};render()">Apply</button><button class="btn ghost" onclick="exportCSV('audit')">CSV</button></div>
   <p class="muted small">${rows.length} entries in range · oldest entry in the live log: ${fmtD(oldest) || '—'}</p>${tbl(['Time', 'User', 'Role', 'Action', 'Details'], rows.map(a => [fmtDT(a.t), esc(a.user), esc(a.role), esc(a.action), esc(a.detail)]), { key: 'aud', size: 50, empty: 'No entries' })}`)}`;
};
function printAnchor() {
  const v = verifyAudit(); if (!v.ok) return toast('Audit trail is not intact: ' + v.msg, 1);
  audit('Audit anchor printed', 'entries: ' + (DB.audit.length + 1)); const head = DB.audit[0].h; DB.anchors.unshift({ t: nowISO(), head, n: DB.audit.length, by: ME.name }); save();
  openModal(`<div class="print report"><h3>Audit trail anchor — ${esc(DB.settings.labName)}</h3><p>Printed ${fmtDT(nowISO())} by ${esc(ME.name)}</p><p>Audit entries: <b>${DB.audit.length}</b></p><p>Chain code: <b class="mono">${head}</b></p>
  <div class="sign two"><div>Quality officer ____________________</div><div>Laboratory director ____________________</div></div>
  <p class="small">File this sheet in the quality records. If any audit entry up to this point is later removed or changed, the system will no longer find this code and the integrity check will report it.</p></div><div class="actions noprint"><button class="btn pri" onclick="window.print()">${icon('print')} Print</button></div>`, { size: 'md' });
}
async function exportAuditArchive() { if (!(await csvWarn())) return; downloadFile(`audit_trail_${today()}.json`, JSON.stringify({ lab: DB.settings.labName, exported: nowISO(), head: DB.audit[0] && DB.audit[0].h, archives: DB.archives, entries: DB.audit }, null, 1)); audit('Audit trail exported'); save(); }
function archiveDlg() {
  const years = [...new Set(DB.audit.map(a => new Date(a.t).getFullYear()))].filter(y => y < new Date().getFullYear()).sort();
  if (!years.length) return toast('Nothing to archive — only the current year is in the log', 1);
  openModal(`<h3>${icon('archive')} Archive a past year</h3><p>Moves audit entries, SMS, QC runs and stock movements up to the end of the chosen year into an <b>encrypted archive file</b>, and removes them from the live database. Orders and patients are kept.</p>
  ${field('Archive everything up to the end of', sel('ar_y', years.map(String), String(years[years.length - 1])))}${field('Archive password (min 8, letters + numbers)', inp('ar_p1', '', 'password'))}${field('Repeat password', inp('ar_p2', '', 'password'))}
  <div class="note warn">Store the archive file and its password safely — it is part of the quality records.</div><div class="actions"><button class="btn pri" onclick="doArchive()">Create archive & download</button></div>`, { size: 'sm' });
}
async function doArchive() {
  const y = +val('ar_y'), p1 = val('ar_p1'); const w = pwWeak(p1); if (w) return toast(w, 1); if (p1 !== val('ar_p2')) return toast('Passwords do not match', 1);
  const v = verifyAudit(); if (!v.ok) return toast('The audit trail is not intact — archive refused: ' + v.msg, 1);
  const cut = new Date(y + 1, 0, 1).toISOString(); const old = e => e.t < cut;
  const part = { audit: DB.audit.filter(old), sms: DB.sms.filter(old), qcRuns: DB.qcRuns.filter(old), stockMoves: DB.stockMoves.filter(old) };
  if (!part.audit.length) return toast('No audit entries before ' + (y + 1), 1);
  const lastH = part.audit[0].h || 'LEGACY'; const remaining = DB.audit.filter(e => !old(e)); if (remaining.length && remaining[remaining.length - 1].prev !== lastH) return toast('Archive consistency check failed — nothing changed', 1); const anchorHeads = (DB.anchors || []).filter(a => a.t < cut).map(a => a.head);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(p1, salt), new TextEncoder().encode(JSON.stringify(Object.assign({ lab: DB.settings.labName, to: ymd(new Date(y, 11, 31)), lastH }, part))));
  downloadFile(`lims_archive_${y}.enc.json`, JSON.stringify({ format: 'eglims-enc-1', kind: 'archive', year: y, salt: b64(salt), iv: b64(iv), data: b64(ct) }));
  DB.audit = DB.audit.filter(e => !old(e)); DB.sms = DB.sms.filter(e => !old(e)); DB.qcRuns = DB.qcRuns.filter(e => !old(e) || DB.qcRuns.filter(r => r.test === e.test).indexOf(e) === 0); DB.stockMoves = DB.stockMoves.filter(e => !old(e));
  DB.archives.unshift({ t: nowISO(), to: ymd(new Date(y, 11, 31)), n: part.audit.length, lastH, anchorHeads, by: ME.name });
  closeModal(); commit('Year archived', `${y}: ${part.audit.length} audit entries`); toast('Archive created — database size reduced');
}

/* =====================================================================
   DATA INTEGRITY
   ===================================================================== */
function integrityCheck() {
  const issues = []; const add = (sev, area, msg) => issues.push({ sev, area, msg });
  const pid = new Set(DB.patients.map(p => p.id)), tests = new Set(DB.tests.map(t => t.code)), oids = new Set(DB.orders.map(o => o.id));
  const dupe = (arr, area) => { const seen = new Set(); arr.forEach(x => { if (seen.has(x.id)) add('error', area, 'Duplicate ID ' + x.id); seen.add(x.id); }); };
  dupe(DB.patients, 'Patients'); dupe(DB.orders, 'Orders'); dupe(DB.samples, 'Samples'); dupe(DB.payments, 'Payments'); dupe(DB.users, 'Users');
  DB.orders.forEach(o => {
    if (!pid.has(o.patientId)) add('error', 'Orders', `${o.id}: patient ${o.patientId} is missing`); else if (P(o.patientId).mergedInto) add('warn', 'Orders', `${o.id}: points to a merged patient file`);
    o.items.forEach(i => { if (!tests.has(i.code)) add('error', 'Orders', `${o.id}: unknown test ${i.code}`); if (i.status === 'med' && !i.medBy) add('error', 'Validation', `${o.id} ${i.code}: validated without a validator`); if (i.status === 'med' && (i.result === '' || i.result == null)) add('error', 'Validation', `${o.id} ${i.code}: validated with an empty result`); });
    if (Math.abs(r2(o.gross * (1 - o.discount / 100)) - o.net) > 0.011) add('warn', 'Orders', `${o.id}: net does not match gross and discount`);
    if (Math.abs((o.net - o.payerShare) - o.patientShare) > 0.011) add('warn', 'Orders', `${o.id}: payer and patient shares do not add up`);
    const paid = paidOf(o); if (!o.cancelled && paid > o.patientShare + 0.011) add('warn', 'Payments', `${o.id}: paid exceeds the patient share`); if (o.cancelled && Math.abs(paid) > 0.011) add('warn', 'Payments', `${o.id}: cancelled but net payments are ${paid}`);
  });
  DB.samples.forEach(s => { if (!oids.has(s.orderId)) add('error', 'Samples', `${s.id}: order missing`); });
  DB.payments.forEach(p => { if (!oids.has(p.orderId)) add('error', 'Payments', `${p.id}: order missing`); });
  DB.lots.forEach(l => { if (!DB.items.some(i => i.id === l.item)) add('error', 'Inventory', `Lot ${l.lot}: item missing`); if (l.qty < 0) add('error', 'Inventory', `Lot ${l.lot}: negative quantity`); });
  DB.qcMaterials.forEach(m => { if (!tests.has(m.test)) add('error', 'QC', `QC material for unknown test ${m.test}`); if (m.type !== 'qual' && !(m.sd > 0)) add('error', 'QC', `QC ${m.test} ${m.level}: SD must be > 0`); });
  DB.tests.filter(t => qcRequired(t) && !DB.qcMaterials.some(m => m.test === t.code)).forEach(t => add('error', 'QC', `${t.name}: analyzer test without QC material (results blocked)`));
  const ex = [...new Set(DB.qcMaterials.filter(m => m.example).map(m => m.test))]; if (ex.length) add('warn', 'QC', `Example QC targets still in use for: ${ex.join(', ')}`);
  DB.packages.forEach(p => p.tests.forEach(c => { if (!tests.has(c)) add('error', 'Packages', `${p.name}: unknown test ${c}`); }));
  DB.tests.forEach(t => { if (t.device && !DB.devices.some(d => d.id === t.device)) add('error', 'Catalogue', `${t.code}: analyzer missing`); if (t.reagent && !DB.items.some(i => i.id === t.reagent)) add('error', 'Catalogue', `${t.code}: reagent item missing`); if (t.calc && (t.components || []).some(c => !tests.has(c))) add('error', 'Catalogue', `${t.code}: calculation component missing`); (t.reflex || []).forEach(r => { if (!tests.has(r.add)) add('warn', 'Catalogue', `${t.code}: reflex test ${r.add} does not exist`); }); });
  if (!DB.users.some(u => u.role === 'admin' && u.active)) add('error', 'Users', 'There is no active administrator');
  DB.users.filter(u => u.active && u.mustChange).forEach(u => add('warn', 'Security', `${u.name} still has a default or reset password`));
  DB.users.filter(u => u.active && u.lockUntil && new Date(u.lockUntil) > new Date()).forEach(u => add('warn', 'Security', `${u.name} is locked after failed logins`));
  if (DB.settings.autoTechValidation && !DB.settings.autoValApproval) add('error', 'Validation', 'Automatic technical validation is enabled without a recorded approval');
  if (!STORE.key) add('error', 'Security', 'Database encryption is not active');
  const v = verifyAudit(); if (!v.ok) add('error', 'Audit trail', v.msg);
  return issues;
}
let INTEG = null;
function runIntegrity() { INTEG = integrityCheck(); audit('Integrity check run', `${INTEG.filter(i => i.sev === 'error').length} errors, ${INTEG.filter(i => i.sev === 'warn').length} warnings`); save(); render(); }

function saveSettings() { Object.assign(DB.settings, { labName: val('st_n'), license: val('st_l'), address: val('st_a'), phone: val('st_p'), taxId: val('st_t'), retentionYears: +val('st_r') || 10, maxDiscountReception: +val('st_d') || 0, dsrTargetDays: +val('st_ds') || 30, eReceiptObligated: chk('st_er'), eReceiptCheckDate: val('st_ed'), eReceiptCheckNote: val('st_en'), amendTwoPerson: chk('st_2p') }); commit('Settings updated'); toast('Saved'); }
function saveHours() {
  const o = val('hr_o'), c = val('hr_c'); if (!o || !c || o >= c) return toast('Opening time must be before closing time', 1);
  const closed = [...document.querySelectorAll('.hr_d:checked')].map(x => +x.value); if (closed.length >= 7) return toast('At least one working day is required', 1);
  const hol = val('hr_h').split(/\r?\n/).map(x => x.trim()).filter(Boolean); const bad = hol.find(x => !/^\d{4}-\d{2}-\d{2}$/.test(x)); if (bad) return toast('Invalid date: ' + bad, 1);
  DB.settings.hours = { open: o, close: c, closed, holidays: hol }; commit('Working hours saved'); toast('Saved');
}
function saveAutoVal() {
  if (ME.role !== 'admin') return toast('Only an administrator can change this policy', 1); const en = chk('av_en');
  if (en) { const d = U(val('av_by')); if (!d || !val('av_ref') || !val('av_dt')) return toast('Enabling requires the approving physician, the policy reference and the approval date', 1); DB.settings.autoValApproval = { by: d.name, reg: d.regNo, ref: val('av_ref'), date: val('av_dt'), recordedBy: ME.name, at: nowISO() }; }
  DB.settings.autoTechValidation = en; commit(en ? 'Auto-validation ENABLED' : 'Auto-validation disabled', en ? DB.settings.autoValApproval.ref + ' — ' + DB.settings.autoValApproval.by : '');
}
function saveBranding() { Object.assign(DB.settings, { reportFooter: val('br_foot'), reportPaper: val('br_paper'), receiptFormat: val('br_rcp') }); commit('Branding saved'); toast('Saved'); }
function uploadLogo(el) {
  const f = el.files[0]; if (!f) return; if (f.size > 3 * 1048576) return toast('Image is too large (max 3 MB)', 1);
  const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const sc = Math.min(1, 280 / img.width, 110 / img.height), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc)); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); let u = c.toDataURL('image/png'); if (u.length > 160000) u = c.toDataURL('image/jpeg', 0.8); DB.settings.logo = u; commit('Logo uploaded'); toast('Logo saved'); }; img.onerror = () => toast('Could not read the image', 1); img.src = r.result; }; r.readAsDataURL(f);
}
function printKindCSS(kind) {
  const s = DB.settings;
  if (kind === 'label') return '@page{size:50mm 25mm;margin:0}.print.labels .label{width:50mm;height:25mm;page-break-after:always;border:0;margin:0}';
  if (kind === 'receipt') return s.receiptFormat === '80mm' ? '@page{size:80mm auto;margin:3mm}.print.receipt{width:74mm;font-size:11px}' : '@page{size:A5;margin:10mm}';
  if (kind === 'report') { const el = document.querySelector && document.querySelector('.print.report'); const ref = String((el && el.dataset && el.dataset.ref) || '').replace(/["\\\n]/g, ''); return `@page{size:${s.reportPaper || 'A4'};margin:14mm 12mm 16mm;@bottom-left{content:"${ref}";font-size:8pt;color:#555}@bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:8pt;color:#555}}`; }
  return '@page{size:A4;margin:12mm}';
}
if (typeof window !== 'undefined' && window.print && !IS_TEST) { const _p = window.print.bind(window); window.print = function () { let kind = 'doc'; const m = $('modal'); const el = (m && m.querySelector && m.querySelector('.print')) || (document.querySelector && document.querySelector('#pt_out .report')); if (el && el.classList) { if (el.classList.contains('labels')) kind = 'label'; else if (el.classList.contains('receipt')) kind = 'receipt'; else if (el.classList.contains('report')) kind = 'report'; } const st = $('pstyle'); if (st) st.textContent = printKindCSS(kind); _p(); }; }

   HELP
   ===================================================================== */
VIEWS.help = () => `<div class="pagehead"><h2>${icon('help')} Help</h2></div>
 <div class="grid2">${card('Daily workflow', `<ol class="steps"><li><b>Start of day</b> — unlock the database with the passphrase; each user logs in with a personal password.</li><li><b>QC</b> — run QC for every analyzer test. A test stays blocked until its QC is accepted for the current period.</li><li><b>Reception</b> — find or register the patient (consent first; the national ID fills in date of birth and sex), choose tests, take payment. Samples are created after payment or payer approval.</li><li><b>Collection</b> — check identity with two identifiers, print labels, collect. Scan barcodes to receive samples in the laboratory.</li><li><b>Results</b> — enter or import results. Calculated tests and eGFR fill in automatically. Use comment templates and reflex suggestions.</li><li><b>Validation</b> — technical, then medical validation by a physician registered in the test's specialty. Critical values need a documented call.</li><li><b>Release</b> — hand over the printed report after payment. SMS only says results are ready.</li><li><b>End of day</b> — close cashier shifts, print the daily cash report and the audit anchor, take an encrypted backup, lock the database.</li></ol>`)}
 ${card('Keyboard shortcuts', tbl(['Keys', 'Action'], [['/', 'Search patients, orders, barcodes'], ['Esc', 'Close window / menus'], ['Alt + N', 'New order (Reception)'], ['Alt + D', 'Dashboard'], ['Alt + R', 'Results & Validation'], ['?', 'Help'], ['Click a column heading', 'Sort the column']])) + card('Your data', `<ul class="small"><li>Everything is encrypted (AES-256) on this computer only. Without the database passphrase nobody can recover it — keep it in a sealed envelope with the laboratory director.</li><li>Take an encrypted backup at least weekly and keep it off this computer.</li><li>Use one browser window. If another window changes the data, this one pauses saving and offers to load the latest data.</li><li>Reference ranges, QC targets, prices and comment templates in the demo are examples — the laboratory director must set and approve them before live use.</li><li>Archive past years from the Audit Log to keep the system fast.</li></ul>`)}</div>`;

if (!window.__LIMS_TEST__) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); }
</script>
